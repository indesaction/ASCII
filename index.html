<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ASCII Atelier — images & vectors set in type</title>
    <meta
      name="description"
      content="Turn images, SVG vectors, video, camera and text into ASCII art. Animate it, edit it glyph by glyph, and export PNG, SVG, CMYK PDF, GIF, video or a live web embed."
    />
    <meta name="theme-color" content="#f3f0ea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Atelier" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preload" href="./fonts/JetBrainsMonoNL-Regular.woff" as="font" type="font/woff" crossorigin />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('ascii-atelier:v1') || '{}')
        var t = (s.ui && s.ui.theme) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = t
        if (s.ui && s.ui.accent) document.documentElement.style.setProperty('--accent', s.ui.accent)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>ASCII Atelier needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
